bootstrap:
  draws: 2000
  seed: 73052
numerical_tolerances:
  replay_absolute: 0.0000005
  RT_reconstruction_absolute: 0.0000005
  state_hash_exact: true
runtime:
  torch_threads: 1
  cache_snapshots: true
  checkpoint_storage: anchors_only
