[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-sequence-paper"
version = "2.0.0"
description = "Frozen four-experiment context-dependent sequence generalization analysis"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.2.6", "pandas==2.3.2", "torch==2.8.0", "matplotlib==3.10.5", "scipy==1.16.1"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]
historical = ["scikit-learn==1.7.1", "statsmodels==0.14.6", "PyYAML==6.0.2", "tabulate==0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]
